version: '3.9'

services:
  mongoserver:
    image: mongo:7
    container_name: taskflow-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-net

  redisserver:
    image: redis:7-alpine
    container_name: taskflow-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - taskflow-net

  backend:
    build: .
    container_name: taskflow-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongoserver:27017/taskflow
      - REDIS_HOST=redisserver
      - REDIS_PORT=6379
      - CACHE_TTL=60
      - CORS_ORIGIN=*
    depends_on:
      - mongoserver
      - redisserver
    networks:
      - taskflow-net

  worker:
    build: .
    container_name: taskflow-worker
    restart: always
    command: npm run worker
    environment:
      - MONGO_URI=mongodb://mongoserver:27017/taskflow
      - REDIS_HOST=redisserver
      - REDIS_PORT=6379
    depends_on:
      - mongoserver
      - redisserver
    networks:
      - taskflow-net

volumes:
  mongo-data:

networks:
  taskflow-net:
    driver: bridge